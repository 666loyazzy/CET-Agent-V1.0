name: English pronunciation checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m venv .speech-venv
      - run: .speech-venv/bin/python -m pip install -r speech_service/requirements.txt pytest httpx
      - run: .speech-venv/bin/python -m pytest tests/test_speech_engine.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
